<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap | Make remote work</title>
  <link rel="icon" href="images/favicon-32x32.png">

</head>
<body>
  <header class="site-header">

      <img src="images/icon-menu.svg" alt="" width="32" height="18">
    </button>
    <div class="shade"></div>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <button class="close-menu" type="button" aria-label="Close navigation">
        <img src="images/icon-close-menu.svg" alt="" width="26" height="26">
      </button>
      <ul class="nav-links">
        <li class="dropdown">
          <button class="dropdown-button" type="button" aria-controls="features" aria-expanded="false">Features</button>
          <ul class="submenu features" id="features" hidden>
            <li><a href="#"><img src="images/icon-todo.svg" alt="">Todo List</a></li>
            <li><a href="#"><img src="images/icon-calendar.svg" alt="">Calendar</a></li>
            <li><a href="#"><img src="images/icon-reminders.svg" alt="">Reminders</a></li>
            <li><a href="#"><img src="images/icon-planning.svg" alt="">Planning</a></li>

        </li>
        <li class="dropdown">
          <button class="dropdown-button" type="button" aria-controls="company" aria-expanded="false">Company</button>
          <ul class="submenu" id="company" hidden>
            <li><a href="#">History</a></li>
            <li><a href="#">Our Team</a></li>
            <li><a href="#">Blog</a></li>
          </ul>
        </li>
        <li><a href="#">Careers</a></li>
        <li><a href="#">About</a></li>
      </ul>
      <ul class="account-links">
        <li><a href="#">Login</a></li>
        <li><a class="register" href="#">Register</a></li>
      </ul>
    </nav>
  </header>
  <main class="hero">
    <picture class="hero-image">
      <source media="(max-width: 900px)" srcset="images/image-hero-mobile.png">
      <img src="images/image-hero-desktop.png" alt="A person working on a laptop surrounded by colourful geometric shapes">
    </picture>
    <div class="hero-content">
      <h1>Make<span> remote work</span></h1>
      <p>Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
      <a class="learn-more" href="#">Learn more</a>
      <ul class="clients" aria-label="Clients">
        <li><img src="images/client-databiz.svg" alt="Databiz"></li>
        <li><img src="images/client-audiophile.svg" alt="Audiophile"></li>
        <li><img src="images/client-meet.svg" alt="Meet"></li>
        <li><img src="images/client-maker.svg" alt="Maker"></li>
      </ul>
    </div>
